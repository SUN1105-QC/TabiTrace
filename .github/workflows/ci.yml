name: Application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tabitrace_test
          MYSQL_USER: tabitrace_test
          MYSQL_PASSWORD: ci_payment_only
          MYSQL_ROOT_PASSWORD: ci_root_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_root_only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      PAYMENT_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/tabitrace_test?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC
      PAYMENT_TEST_DB_USER: tabitrace_test
      PAYMENT_TEST_DB_PASSWORD: ci_payment_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - run: mvn -B -ntp -f backend/pom.xml verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      APP_URL: https://tabi.sunows.com
      API_INTERNAL_URL: http://api:8080
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_MAP_STYLE_URL: https://tiles.openfreemap.org/styles/liberty
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check

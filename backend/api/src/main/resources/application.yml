spring:
  application:
    name: tabitrace-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tabitrace?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:tabitrace_app}
    password: ${DB_PASSWORD:tabitrace_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  # 邮件：复用 spring-boot-starter-mail（SMTP）。本地默认连 localhost:1025 的开发邮件接收器
  # （backend/scripts/dev-mail-catcher.mjs 或 Mailpit），生产环境通过 MAIL_* 环境变量配置真实 SMTP。
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.ssl.enable: ${MAIL_SMTP_SSL:false}
      # 超时要短：SMTP 不可用时尽快返回“发送失败”，而不是让请求一直挂着
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 8000
      mail.smtp.writetimeout: 8000
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'
server:
  # Railway 等平台通过 PORT 注入监听端口；本地沿用 SERVER_PORT / 8080
  port: ${PORT:${SERVER_PORT:8080}}
  # 部署新版本时先处理完进行中的请求再退出
  shutdown: graceful
management:
  # SMTP 暂时不可用不应让整个 API 显示为 DOWN（启动脚本也依赖 health 判断后端是否已运行）；发送失败由接口本身如实返回
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  api-url: ${APP_API_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  mail:
    # smtp（默认，spring.mail.*）或 resend（HTTPS API；Railway 非 Pro 套餐不允许出站 SMTP 时使用）
    provider: ${MAIL_PROVIDER:smtp}
    resend:
      api-key: ${RESEND_API_KEY:}
      base-url: ${RESEND_BASE_URL:https://api.resend.com}
    from-address: ${MAIL_FROM_ADDRESS:no-reply@tabitrace.local}
    from-name: ${MAIL_FROM_NAME:旅迹 TabiTrace}
  # 邮箱验证码（通用，按 purpose 区分）；验证码与令牌只保存哈希，HMAC 密钥默认沿用 JWT_SECRET
  email-verification:
    code-ttl-seconds: 600
    resend-after-seconds: 60
    max-attempts: 5
    token-ttl-seconds: 1800
    email-hourly-limit: 5
    ip-hourly-limit: 20
  # 登录失败频率限制：窗口内同一邮箱 / 同一 IP 失败次数上限（基于 login_failures 表）
  login-throttle:
    window-seconds: 900
    email-limit: 8
    ip-limit: 40
  # 长期凭证（refresh token）只放在 HttpOnly Cookie 里，前端 JS 读不到；生产环境必须 Secure
  auth:
    refresh-cookie:
      name: tt_refresh
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: Strict
      path: /api/v1
  # 客户端 IP（登录 / 验证码频率限制）：API 只能经由可信代理访问时（如 Railway 私网 + 前端同源代理），
  # 取 X-Forwarded-For 最右侧一项（由平台边缘代理追加）；否则只信任本机 nginx 设置的 X-Real-IP
  client-ip:
    trust-forwarded-for: ${TRUST_PROXY_HEADERS:false}
  jwt:
    secret: ${JWT_SECRET:tabitrace-dev-secret-change-me-32bytes-minimum}
    access-ttl-minutes: 15
    refresh-ttl-days: 30
  storage:
    mode: ${STORAGE_MODE:local}
    local:
      directory: ${LOCAL_STORAGE_DIR:./.tabitrace/uploads}
    r2:
      endpoint: ${R2_ENDPOINT:}
      access-key: ${R2_ACCESS_KEY:}
      secret-key: ${R2_SECRET_KEY:}
      bucket: ${R2_BUCKET:}
      public-base-url: ${R2_PUBLIC_BASE_URL:https://example.invalid/r2}
  payments:
    mode: ${PAYMENTS_MODE:mock}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  # 「我的音乐」（会员上传自定义音乐）的全部限制；前端从 GET /api/v1/user/music 读取同一份数值
  user-music:
    max-file-bytes: ${USER_MUSIC_MAX_FILE_BYTES:31457280}
    max-tracks: ${USER_MUSIC_MAX_TRACKS:20}
    max-total-bytes: ${USER_MUSIC_MAX_TOTAL_BYTES:524288000}
    min-duration-seconds: 3
    max-duration-seconds: 1800
    play-url-ttl-seconds: 900
    abandon-after-minutes: 120
    # 会员到期后音乐转为只读，至少保留这么多天（目前不自动删除）
    retention-days-after-expiry: 365
    cleanup-interval-ms: 600000
  video:
    mock-renderer-enabled: ${VIDEO_MOCK_RENDERER:true}
    mock-renderer-interval-ms: 2500
    # PROCESSING 任务超过这么久没有心跳（Worker 每 15 秒写一次）就判定为生成中断
    processing-timeout-seconds: ${VIDEO_PROCESSING_TIMEOUT_SECONDS:300}
    watchdog-interval-ms: 60000

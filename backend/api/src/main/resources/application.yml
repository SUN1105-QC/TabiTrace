spring:
  application:
    name: tabitrace-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tabitrace?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:tabitrace_app}
    password: ${DB_PASSWORD:tabitrace_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  api-url: ${APP_API_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  jwt:
    secret: ${JWT_SECRET:tabitrace-dev-secret-change-me-32bytes-minimum}
    access-ttl-minutes: 15
    refresh-ttl-days: 30
  storage:
    mode: ${STORAGE_MODE:local}
    local:
      directory: ${LOCAL_STORAGE_DIR:./.tabitrace/uploads}
    r2:
      endpoint: ${R2_ENDPOINT:}
      access-key: ${R2_ACCESS_KEY:}
      secret-key: ${R2_SECRET_KEY:}
      bucket: ${R2_BUCKET:}
      public-base-url: ${R2_PUBLIC_BASE_URL:https://example.invalid/r2}
  payments:
    mode: ${PAYMENTS_MODE:mock}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  video:
    mock-renderer-enabled: ${VIDEO_MOCK_RENDERER:true}
    mock-renderer-interval-ms: 2500

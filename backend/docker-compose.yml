services:
  mysql:
    image: mysql:8.4
    container_name: tabitrace-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tabitrace
      MYSQL_USER: tabitrace_app
      MYSQL_PASSWORD: tabitrace_dev
      MYSQL_ROOT_PASSWORD: root_dev_only
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "3306:3306"
    volumes:
      - tabitrace_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_only"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  tabitrace_mysql:
